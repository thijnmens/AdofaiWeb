<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Atom Theme</title>
    
    <style>
        body {
            background: radial-gradient(ellipse at center, rgba(68,74,80,1) 36%,rgba(22,28,32,1) 100%);
        }
    </style>
</head>
<body class="text-white">

    <div class="backdrop-blur-2xl p-16 w-full h-screen flex justify-left">
        <div class="flex p-2">
            <img src="https://i.kym-cdn.com/photos/images/newsfeed/002/969/518/706.jpg" alt="Level Cover" class="object-cover align-middle rounded-3xl" />
        </div>
        <div class="mx-16">
            <div>
                <h1 class="text-5xl">Title</h1>
                <div class="flex justify-left gap-4">
                    <p class="text-2xl">Author</p><p>-</p><p class="text-2xl">Artist</p>
                </div>
            </div>
        </div>
    </div>


    <script lang="js">
        const websocket = new WebSocket("ws://localhost:4444/")
        let isConnected = false

        let keyCounter = 0

        websocket.onopen = (e) => {
            isConnected = true
            console.log("Connected")
        }

        websocket.onclose = (e) => {
            isConnected = false
            console.log("Disconnected")
        }

        websocket.onmessage = (e) => {
            const message = JSON.parse(e.data)

            if (message.type === "KeyDown") {
                keyCounter += message.data.keys.length
            }

            if (message.type === "LoadScene") {
                keyCounter = 0
            }

            document.getElementById("keyCount").innerHTML = keyCounter
        }


    </script>
</body>
</html>
