<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <title>Atom Adofai Overlay</title>
</head>

<!--
PLEASE USE A MINIMUM WITH OF 500 AND A MINIMUM HEIGHT OF 200 IS YOUR OBS BROWSER SOURCE

I recommend using 1200 x 250 on a 1440p canvas, but it will automatically scale to smaller / bigger ratios
-->

<body class="m-0 h-screen w-screen overflow-hidden bg-transparent flex items-center ml-12 font-['Inter']">

<div id="overlay-container" class="opacity-0 transition-opacity duration-500 bg-[#161c20]/85 border border-white/10 backdrop-blur-xl p-6 rounded-[2rem] flex items-center gap-8 shadow-2xl w-fit max-h-[90%]">

    <div class="shrink-0">
        <img id="cover" src="https://cdn2.steamgriddb.com/thumb/486aa02d15fe556ee9e89f3ef3f20b3f.jpg"
             class="w-32 h-32 object-cover rounded-2xl shadow-lg border border-white/10" alt="Cover" />
    </div>

    <div class="flex flex-col flex-grow min-w-0">
        <div class="mb-4">
            <h1 id="title" class="text-white text-4xl font-bold truncate mb-1">Waiting...</h1>
            <div class="flex items-center gap-3 text-gray-300">
                <p id="artist" class="text-xl font-medium truncate">Artist</p>
                <span class="text-[#6366f1] font-bold">/</span>
                <p id="author" class="text-xl truncate">Author</p>
            </div>
        </div>

        <div id="key-container" class="flex gap-3"></div>
    </div>
</div>

<script lang="js">
    const CONFIG = {
        wsUrl: "ws://localhost:4444/",
        keys: [
            { id: 65, label: "A" }, { id: 83, label: "S" }, { id: 68, label: "D" },
            { id: 75, label: "K" }, { id: 76, label: "L" }, { id: 186, label: ";" }
        ],
        classes: {
            idle: ['bg-white/5', 'border-white/10', 'text-white/30'],
            active: ['bg-[#6366f1]', 'border-[#818cf8]', 'scale-95', 'text-white']
        }
    };

    // Get all elements
    const elements = {
        container: document.getElementById("overlay-container"),
        title: document.getElementById("title"),
        artist: document.getElementById("artist"),
        author: document.getElementById("author"),
        cover: document.getElementById("cover"),
        keyBox: document.getElementById("key-container")
    };

    // Create key buttons
    const keyElements = {};
    CONFIG.keys.forEach(key => {
        const div = document.createElement('div');
        // Returned to fixed px sizes for keys to ensure they remain square and readable
        div.className = `w-12 h-12 rounded-xl border-2 flex items-center justify-center font-['JetBrains_Mono'] font-bold text-lg transition-all duration-500 ease-out ${CONFIG.classes.idle.join(' ')}`;
        div.innerText = key.label;
        elements.keyBox.appendChild(div);
        keyElements[key.id] = div;
    });
    
    // Removes XML tags from any given string
    const stripRichText = (str) => (str || "").replace(/<[^>]*>/g, '');

    // Fade in / out the layout
    const setVisibility = (isVisible) => {
        elements.container.classList.toggle('opacity-100', isVisible);
        elements.container.classList.toggle('opacity-0', !isVisible);
    };

    // Handle light-up of key buttons
    const triggerKeyEffect = (el) => {
        el.classList.remove('duration-500', ...CONFIG.classes.idle);
        el.classList.add('duration-0', ...CONFIG.classes.active);
        void el.offsetWidth;
        setTimeout(() => {
            el.classList.remove('duration-0', ...CONFIG.classes.active);
            el.classList.add('duration-500', ...CONFIG.classes.idle);
        }, 50);
    };

    // Create websocket
    const websocket = new WebSocket(CONFIG.wsUrl);

    websocket.onmessage = (e) => {
        const { type, data } = JSON.parse(e.data);

        // Only display the scene when the active scene is "scnGame"
        if (type === "LoadScene") setVisibility(data.scene === "scnGame");

        // Light up key buttons
        if (type === "KeyDown") {
            data.keys.forEach(keyId => keyElements[keyId] && triggerKeyEffect(keyElements[keyId]));
        }

        // Update data on new map
        if (type === "StartMap") {
            elements.title.innerText = stripRichText(data.levelName) || "Unknown";
            elements.artist.innerText = stripRichText(data.levelArtist) || "Unknown";
            elements.author.innerText = stripRichText(data.levelAuthor) || "Unknown";
            
            if (data.previewImage) elements.cover.src = data.levelPath.replace("main.adofai", data.previewImage);
            else if (data.backgroundImage) elements.cover.src = data.levelPath.replace("main.adofai", data.backgroundImage);
            else elements.cover.src = "https://cdn2.steamgriddb.com/thumb/486aa02d15fe556ee9e89f3ef3f20b3f.jpg"
        }
    };
</script>
</body>
</html>
